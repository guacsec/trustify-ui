name: CI (e2e)

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"
  workflow_call:
  merge_group:

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-envs-for-e2e-ci:
    runs-on: ubuntu-latest
    outputs:
      server_branch: ${{ steps.set-outputs.outputs.server_branch }}
    steps:
      - name: Set Trustify branch
        id: set-outputs
        env:
          TARGET_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref }}
        run: |
          branch="${TARGET_REF#refs/heads/}"
          echo "server_branch=$branch" >> "$GITHUB_OUTPUT"

  build-and-upload-for-e2e-ci:
    runs-on: ubuntu-latest
    needs: discover-envs-for-e2e-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build Trustify with the embedded UI
        run: |
          docker build . -t ghcr.io/guacsec/trustd:pr-test -f Dockerfile.prod \
            --build-arg server_branch=${{ needs.discover-envs-for-e2e-ci.outputs.server_branch }}
          docker save -o /tmp/trustd.tar ghcr.io/guacsec/trustd:pr-test

      - name: Upload Trustify image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: trustd
          path: /tmp/trustd.tar
          retention-days: 1

  run-e2e-ci:
    needs:
      - build-and-upload-for-e2e-ci
      - discover-envs-for-e2e-ci
    uses: ./.github/workflows/ci-e2e-template.yaml
    with:
      artifact: trustd
      server_image: ghcr.io/guacsec/trustd:pr-test
