name: Start trustify
description: Start trustify using docker compose.
inputs:
  server_image:
    description: image uri for the server (ie. ghcr.io/<namespace>/<image-name>:<tag>)
    type: string
    required: false
    default: ""
  server_db_image:
    description: image uri for server-postgres (ie. ghcr.io/<namespace>/<image-name>:<tag>)
    type: string
    required: false
    default: ""
  playwright_version:
    description: version of the playwright image to run
    type: string
    required: false
    default: ""
outputs:
  server_port:
    description: Port where the server is running
    value: ${{ steps.set-output.outputs.server_port }}
  ui_port:
    description: Port where the UI is running
    value: ${{ steps.set-output.outputs.ui_port }}
  playwright_port:
    description: Port where the UI is running
    value: ${{ steps.set-output.outputs.playwright_port }}
runs:
  using: "composite"
  steps:
    - name: Start trustify
      working-directory: ${{ github.action_path }}/../../..
      shell: bash
      run: |
        opts=""

        if [ -n "${{ inputs.server_image }}" ]; then
          opts="${opts} TRUSTIFY_IMAGE=${{ inputs.server_image }}"
        fi
        if [ -n "${{ inputs.server_db_image }}" ]; then
          opts="${opts} POSTGRESQL_IMAGE=${{ inputs.server_db_image }}"
        fi

        if [ -n "${{ inputs.playwright_version }}" ]; then
          opts="${opts} PLAYWRIGHT_VERSION=${{ inputs.playwright_version }}"
        fi

        echo "opts: $opts"

        eval "${opts} docker compose up -d"

    - name: Wait for services to be ready
      working-directory: ${{ github.action_path }}/../../..
      shell: bash
      run: |
        url="http://localhost:8080/"
        deadline=$((SECONDS + 180))
        response=$(mktemp)
        trap 'rm -f "$response"' EXIT

        until curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "$url" -o "$response" && grep -qi "<html" "$response"; do
          if (( SECONDS >= deadline )); then
            echo "::error::Trustify did not serve the embedded UI at $url within 180 seconds."
            docker compose ps -a || true
            docker compose logs --no-color --tail=100 || true
            exit 1
          fi
          echo "Waiting for HTML page at $url..."
          sleep 2
        done

    - id: set-output
      shell: bash
      run: |
        echo "server_port=8080" >> $GITHUB_OUTPUT
        echo "ui_port=8080" >> $GITHUB_OUTPUT
        echo "playwright_port=5000" >> $GITHUB_OUTPUT
